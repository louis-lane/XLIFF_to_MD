name: Build EXE Tool

on: [push, workflow_dispatch]

jobs:
  build_windows_exe:
    runs-on: windows-latest  # Important: We build on Windows to make a Windows .exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install pyinstaller

      - name: Build EXE
        run: |
          # --onefile makes it a single .exe
          # --name sets the output name
          pyinstaller --onefile --name "CourseExtractor" course_converter.py

      - name: Upload EXE as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CourseExtractor-Tool
          path: dist/CourseExtractor.exe
