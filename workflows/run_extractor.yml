name: Extract Course Content

# Run this whenever a change is pushed to the 'main' branch
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Allows you to click a button to run it manually

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run Extraction Script
        run: |
          python process_courses.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add *.md
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Generated Course Summaries" && git push)
